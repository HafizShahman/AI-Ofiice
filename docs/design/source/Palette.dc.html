<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Office — Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Share+Tech+Mono&amp;display=swap">
<style>
body{margin:0;background:#070B14}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #22D3EE;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; min-height: 900px; background: #0A101D; color: #E6EDF7; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; overflow: hidden; display: flex; justify-content: center; padding: 120px 16px 24px; box-sizing: border-box;">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0.45;">
    <div style="height: 48px; border-bottom: 1px solid #22304A; background: #0B1220;"></div>
    <div style="height: 30%; background: #0D1528; border-bottom: 2px solid #22D3EE;"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(3,6,12,0.6);"></div>

  <div role="dialog" aria-modal="true" aria-label="Command palette" style="position: relative; width: 100%; max-width: 620px; align-self: flex-start; border-radius: 14px; background: #0E1524; border: 1px solid #2B3B5C; box-shadow: 0 24px 64px rgba(0,0,0,0.6); overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 56px; border-bottom: 1px solid #22304A;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A9BB8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="aio-cmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search agents and commands</label>
      <input id="aio-cmd" value="res" style="flex: 1 1 auto; min-width: 0; height: 40px; border: 0; background: transparent; font-size: 16px; outline: none;">
      <kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px solid #22304A; color: #8A9BB8;">Esc</kbd>
    </div>

    <div role="listbox" aria-label="Results" style="padding: 8px; display: flex; flex-direction: column; gap: 2px; max-height: 460px; overflow-y: auto;">
      <span style="padding: 8px 10px 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8A9BB8;">AGENTS</span>
      <div role="option" aria-selected="true" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 8px; background: #141D31; box-shadow: inset 2px 0 0 #22D3EE;">
        <span style="width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #070B14; background: #2DD4BF;">RS</span>
        <span style="flex: 1 1 auto; display: flex; flex-direction: column;"><span style="font-weight: 500;">Researcher</span><span style="font-size: 12px; color: #FBBF24;">Blocked · needs permission · tackld</span></span>
        <span style="font-size: 12px; color: #8A9BB8;">Jump to</span>
        <kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px solid #22304A;">↵</kbd>
      </div>
      <div role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 8px;">
        <span style="width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: #141D31; color: #8A9BB8;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></span>
        <span style="flex: 1 1 auto;">Open DM with <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px;">@researcher</span></span>
      </div>

      <span style="padding: 12px 10px 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8A9BB8;">COMMANDS</span>
      <div role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border-radius: 8px;">
        <span style="width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: #141D31; color: #8A9BB8;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg></span>
        <span style="flex: 1 1 auto;">Reset camera</span>
        <kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A9BB8;">R</kbd>
      </div>
      <div role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border-radius: 8px;">
        <span style="width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: #141D31; color: #8A9BB8;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"></path></svg></span>
        <span style="flex: 1 1 auto;">Wallboard mode</span>
        <kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A9BB8;">F</kbd>
      </div>
      <div role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border-radius: 8px;">
        <span style="width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: rgba(232,121,249,0.12); color: #F0ABFC;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"></path></svg></span>
        <span style="flex: 1 1 auto;">Turn AI off</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A9BB8;">/ai off</span>
      </div>
      <div role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border-radius: 8px;">
        <span style="width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: #141D31; color: #8A9BB8;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m6 3 14 9-14 9z"></path></svg></span>
        <span style="flex: 1 1 auto;">Start demo simulation</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8A9BB8;">/sim</span>
      </div>

      <span style="padding: 12px 10px 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8A9BB8;">FILTER BY PROJECT</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 10px 8px;">
        <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #22304A; background: transparent; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 12px;">tackld · 3</button>
        <button style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #22304A; background: transparent; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 12px;">ai-office · 2</button>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 16px; border-top: 1px solid #22304A; font-size: 12px; color: #8A9BB8;">
      <span><kbd style="font-family: 'JetBrains Mono', monospace;">↑↓</kbd> move</span>
      <span><kbd style="font-family: 'JetBrains Mono', monospace;">↵</kbd> select</span>
      <span><kbd style="font-family: 'JetBrains Mono', monospace;">[ ]</kbd> prev / next agent</span>
      <span style="margin-left: auto;"><kbd style="font-family: 'JetBrains Mono', monospace;">?</kbd> all shortcuts</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
