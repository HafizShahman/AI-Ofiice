# AI Office on DDEV (needs DDEV v1.24.3+ for the generic web server).
#   ddev start           → server on http://ai-office.ddev.site:3334, Vite dev UI on https://ai-office.ddev.site:5173
#   ddev npm run build   → then the server alone serves the built UI on :3334
# Claude Code hooks run on your Mac, so install them there with the DDEV URL:
#   npm run install-hooks -- --url http://ai-office.ddev.site:3334/hook
name: ai-office
type: generic
webserver_type: generic
nodejs_version: "24"
docroot: ""

web_environment:
  - HOST=0.0.0.0
  - PORT=3334
  - VITE_HOST=0.0.0.0
  - VITE_HMR_HOST=ai-office.ddev.site

web_extra_daemons:
  - name: office-server
    command: "npm run dev:server"
    directory: /var/www/html
  - name: office-web
    command: "npm run dev:web"
    directory: /var/www/html

web_extra_exposed_ports:
  - name: office
    container_port: 3334
    http_port: 3334
    https_port: 3335
  - name: vite
    container_port: 5173
    http_port: 5172
    https_port: 5173

hooks:
  post-start:
    - exec: npm install --no-audit --no-fund && supervisorctl restart webextradaemons:office-server webextradaemons:office-web
