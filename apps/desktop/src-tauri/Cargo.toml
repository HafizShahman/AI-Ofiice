[package]
name = "ai-office-desktop"
version = "0.1.0"
description = "AI Office in its own window, with a tray icon"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
